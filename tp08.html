<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP 8 Les cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
        .card {
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row">

            <div class="col-4">
                <div class="card">
                    <img class="card-img-top" src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1025&auto=format&fit=crop">
                    <div class="card-body">
                        <div class="card-title h4">Diginamic</div>
                        <p class="card-text">Formation Bootstrap !</p>
                    </div>
                    <div class="card-footer">
                        Montpellier
                    </div>
                </div>
            </div>

            <div class="col-4">
                <div class="card">
                    <div class="card-header">
                        Prochaine session
                    </div>
                    <div class="card-body">
                        <h2 class="card-title h5">Découvrir Bootstrap</h2>
                        <p class="card-text">Une journée pour construire des interfaces responsive.</p>
                        <a href="#" class="btn btn-primary">Consulter le programme</a>
                    </div>
                    <div class="card-footer text-body-secondary">
                        Durée : 7 heures
                    </div>
                </div>
            </div>

            <div class="col-4">
                <div class="card bg-dark text-white">
                    <div class="card-header bg-success">
                        Card au choix
                    </div>
                    <div class="card-body">
                        <h2 class="card-title h5">Mes tests</h2>
                        <p class="card-text">Une card avec des couleurs de fond Bootstrap.</p>
                        <a href="#" class="btn btn-warning">Bouton</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
</html>
